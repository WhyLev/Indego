name: Upload Browser extension ZIP on release

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    name: Build ZIP and upload to release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure browser_extension folder exists
        run: |
          if [ ! -d "browser_extension" ]; then
            echo "Folder browser_extension/ not found in repository root" >&2
            exit 1
          fi

      - name: Create browser-extension.zip
        run: |
          rm -f browser-extension.zip
          # Create zip from the contents of browser_extension/ (not the parent folder)
          cd browser_extension
          zip -r ../browser-extension.zip .
          cd -

      - name: List generated artifact
        run: |
          ls -lh browser-extension.zip || true

      - name: Upload ZIP as release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./browser-extension.zip
          asset_name: browser-extension.zip
          asset_content_type: application/zip